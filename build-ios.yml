name: Build CarStream iOS IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned device application
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project CarStream.xcodeproj -target CarStream -configuration Release -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/carstream-build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/carstream-build/CarStream.app" Payload/
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Payload/CarStream.app/Info.plist
          test -f Payload/CarStream.app/CarStream
          ditto -c -k --keepParent Payload CarStream-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: CarStream-unsigned
          path: CarStream-unsigned.ipa
          if-no-files-found: error
